services:
  my-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_ALLOWED_EMAILS: ${VITE_ALLOWED_EMAILS}
    ports:
      - "3000:3000"
    restart: always
    container_name: dashboard-admin
